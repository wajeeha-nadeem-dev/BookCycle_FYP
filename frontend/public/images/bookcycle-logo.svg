<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 378" fill="none">
  <defs>
    <linearGradient id="greenCover" x1="93" y1="26" x2="142" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#165348"/>
      <stop offset="1" stop-color="#103F37"/>
    </linearGradient>
    <linearGradient id="goldCover" x1="55" y1="158" x2="197" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6B269"/>
      <stop offset="1" stop-color="#D9A452"/>
    </linearGradient>
    <linearGradient id="oliveCover" x1="198" y1="43" x2="323" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#706A31"/>
      <stop offset="1" stop-color="#5E5826"/>
